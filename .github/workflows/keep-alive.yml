name: Keep Football Bot Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          curl --fail --silent --show-error --max-time 20 https://footballbozibot.onrender.com/ > /dev/null
